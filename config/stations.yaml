# Research station catalog for Open-Meteo coordinate queries.
# Coordinates are airport reference points (OurAirports / published ARP values).
# These stations are used for weather collection. Polymarket resolution stations
# are parsed from market text and are NOT assumed to equal these ICAO codes.
# Example: Paris temperature markets often resolve at Le Bourget (LFPB), not CDG (LFPG).

stations:
  - station_id: LFPG
    name: Paris Charles de Gaulle
    icao: LFPG
    iata: CDG
    city: paris
    latitude: 49.0097
    longitude: 2.5479
    elevation_m: 119
    timezone_name: Europe/Paris
    coordinate_source: OurAirports ARP (LFPG)

  - station_id: EGLC
    name: London City
    icao: EGLC
    iata: LCY
    city: london
    latitude: 51.5053
    longitude: 0.0553
    elevation_m: 6
    timezone_name: Europe/London
    coordinate_source: OurAirports ARP (EGLC)

