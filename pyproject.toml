[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weather-alpha"
version = "0.1.0"
description = "Research-only Polymarket weather-market data collection and analysis scaffolding. No live trading."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Weather Alpha Research" }]
keywords = ["polymarket", "weather", "research", "read-only"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
  "click>=8.1,<9",
  "duckdb>=1.2,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5.0,<6",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-pyyaml>=6.0,<7",
]

[project.scripts]
weather-alpha = "weather_alpha.cli:main"

[project.urls]
Homepage = "https://github.com/local/polymarket-weather-alpha"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_alpha"]

[tool.hatch.build.targets.sdist]
include = ["src/weather_alpha", "README.md", "config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "-q",
  "--strict-markers",
  "--disable-warnings",
]
markers = [
  "network: live network tests (disabled in the default suite)",
]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
show_error_codes = true
mypy_path = "src"
files = ["src", "tests"]
explicit_package_bases = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
